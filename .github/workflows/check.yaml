name: Check

on:
  push:
    # Pushes to PR branches are already covered by the `synchronize` event
    # below; only the trunk needs its own push trigger.
    branches:
      - beta
      - ci-test
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

# Supersede in-flight runs for the same PR. Give every trunk commit its own
# group so that each one receives a recorded result.
concurrency:
  group: check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-quick:
    name: ${{ matrix.os }} / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: 'Check: Astro'
            command: pnpm run check:astro
          - os: windows-latest
            name: 'Check: Astro'
            command: pnpm run check:astro
          - os: macos-latest
            name: 'Check: Astro'
            command: pnpm run check:astro
          - os: ubuntu-latest
            name: 'Test: Vitest'
            command: pnpm run check:vitest
          - os: windows-latest
            name: 'Test: Vitest'
            command: pnpm run check:vitest
          - os: macos-latest
            name: 'Test: Vitest'
            command: pnpm run check:vitest
          - os: ubuntu-latest
            name: 'Lint: ESLint'
            command: pnpm run check:lint
          - os: windows-latest
            name: 'Lint: ESLint'
            command: pnpm run check:lint
          - os: macos-latest
            name: 'Lint: ESLint'
            command: pnpm run check:lint
          - os: ubuntu-latest
            name: 'Format: Prettier'
            command: pnpm run check:syntax
          - os: windows-latest
            name: 'Format: Prettier'
            command: pnpm run check:syntax
          - os: macos-latest
            name: 'Format: Prettier'
            command: pnpm run check:syntax
          - os: ubuntu-latest
            name: 'Spell check: CSpell'
            command: pnpm run check:spelling:quiet
          - os: windows-latest
            name: 'Spell check: CSpell'
            command: pnpm run check:spelling:quiet
          - os: macos-latest
            name: 'Spell check: CSpell'
            command: pnpm run check:spelling:quiet
          - os: ubuntu-latest
            name: Other checks
            command: pnpm run check:misc
          - os: windows-latest
            name: Other checks
            command: pnpm run check:misc
          - os: macos-latest
            name: Other checks
            command: pnpm run check:misc
          - os: ubuntu-latest
            name: 'Build: Astro'
            command: pnpm run check:build:post:quiet
          - os: windows-latest
            name: 'Build: Astro'
            command: pnpm run check:build:post:quiet
          - os: macos-latest
            name: 'Build: Astro'
            command: pnpm run check:build:post:quiet
          - os: ubuntu-latest
            name: Commit signature
            command: pnpm run check:signed-commit
          - os: windows-latest
            name: Commit signature
            command: pnpm run check:signed-commit
          - os: macos-latest
            name: Commit signature
            command: pnpm run check:signed-commit
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Install packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat deploy/debian-packages.txt)
        env:
          DEBIAN_FRONTEND: noninteractive
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Install Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}
        env:
          WALLETBEAT_ENV: CI
  check-full:
    name: 'Run all CI tests (${{ matrix.os }})'
    runs-on: ${{ matrix.os }}
    needs:
      - check-quick
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
      - name: Install packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat deploy/debian-packages.txt)
        env:
          DEBIAN_FRONTEND: noninteractive
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Install Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run all checks
        run: pnpm run check:ci
        env:
          WALLETBEAT_ENV: CI
