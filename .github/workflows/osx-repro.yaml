name: OSX CI flake reproduction

on:
  workflow_dispatch:
  push:
    branches:
      - osx-ci-test

jobs:
  reproduce:
    name: Reproduce (${{ matrix.mode }}-${{ matrix.worker }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        mode:
          - cold
          - warm
        worker:
          - 01
          - 02
          - 03
          - 04
          - 05
          - 06
          - 07
          - 08
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Install Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run reproduction harness
        run: bash tests/ci/osx-repro.sh
        env:
          OSX_REPRO_ITERATIONS: '10'
          OSX_REPRO_PARALLEL: '3'
          OSX_REPRO_WARM: ${{ matrix.mode == 'warm' && '1' || '0' }}
      - name: Upload Vite debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vite-debug-${{ matrix.mode }}-${{ matrix.worker }}
          path: /tmp/osx-repro-*.log
          if-no-files-found: ignore
