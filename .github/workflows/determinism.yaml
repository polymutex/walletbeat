name: Determinism

on:
  workflow_dispatch:
  push:
    branches:
      - nondeterminism

jobs:
  build-determinism:
    name: Build determinism
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat deploy/debian-packages.txt)
        env:
          DEBIAN_FRONTEND: noninteractive
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Install Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Determinism test (concurrent with a main-repo build for contention)
        run: |
          # Simulate the check:full contention: a main-repo build runs in the
          # background sharing /tmp and the pnpm store, while the determinism
          # test builds its worktrees in parallel.
          WALLETBEAT_BUILD_TEST=true pnpm run build >/tmp/main-build.log 2>&1 &
          MAIN_PID=$!
          bash tests/ci/build-determinism.test.sh
          DET_EXIT=$?
          kill $MAIN_PID 2>/dev/null || true
          wait $MAIN_PID 2>/dev/null || true
          exit $DET_EXIT
        env:
          WALLETBEAT_ENV: CI
          WALLETBEAT_DETERMINISM_BUILD_COUNT: 10
